<button
  type="button"
  (click)="onClick()"
  class="block w-full text-left bg-white border border-gray-200 rounded-lg p-4 hover:border-blue-400 hover:shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-300 transition cursor-pointer"
>
  <div class="flex items-start justify-between gap-4">
    <p class="text-sm font-semibold text-gray-800">{{ solicitud().tipo }}</p>
    <span class="text-xs text-gray-400 shrink-0">
      {{ solicitud().fechaRegistro | date:'dd/MM/yyyy' }}
    </span>
  </div>
  <p class="text-sm text-gray-600 mt-1 line-clamp-2">{{ solicitud().descripcion }}</p>
  <div class="flex items-center gap-2 mt-3">
    <app-badge [text]="solicitud().estado" [variant]="estadoVariant()" />
    <app-badge [text]="solicitud().prioridad" [variant]="prioridadVariant()" />
    <span class="text-xs text-gray-400 ml-auto">{{ solicitud().canalOrigen }}</span>
  </div>
</button>
