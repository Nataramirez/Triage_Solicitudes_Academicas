<div class="relative pl-6 pb-4">
  @if (!isLast()) {
    <span class="absolute left-[6px] top-5 bottom-[-6px] w-px bg-gray-200" aria-hidden="true"></span>
  }
  <span class="absolute left-0 top-1.5 w-3.5 h-3.5 rounded-full bg-blue-500 ring-2 ring-white" aria-hidden="true"></span>
  <p class="text-xs text-gray-400">
    {{ item().fechaCreacion | date:'dd/MM/yyyy HH:mm' }}
  </p>
  <p class="text-sm font-medium text-gray-800 mt-0.5">{{ item().accion }}</p>
  @if (item().observaciones) {
    <p class="text-sm text-gray-600 mt-1">{{ item().observaciones }}</p>
  }
</div>
