<div class="flex flex-wrap items-center gap-3 px-6 py-3 border-b border-slate-200 bg-slate-50">
  <app-select
    [value]="filters().estado"
    placeholder="Estado: todos"
    [options]="estadoOptions"
    (valueChange)="update({ estado: $event })"
  />

  <app-select
    [value]="filters().tipo"
    placeholder="Tipo: todos"
    [options]="tipoOptions"
    (valueChange)="update({ tipo: $event })"
  />

  <app-select
    [value]="filters().prioridad"
    placeholder="Prioridad: todas"
    [options]="prioridadOptions"
    (valueChange)="update({ prioridad: $event })"
  />

  <label class="inline-flex items-center gap-2 ml-auto px-3 py-2 text-sm rounded-md border border-slate-300 bg-white text-slate-700 shadow-sm hover:border-slate-400 cursor-pointer transition-colors select-none">
    <input
      type="checkbox"
      [checked]="filters().misSolicitudes"
      (change)="update({ misSolicitudes: $any($event.target).checked })"
      class="w-4 h-4 accent-slate-700 cursor-pointer"
    />
    Mis solicitudes
  </label>
</div>
