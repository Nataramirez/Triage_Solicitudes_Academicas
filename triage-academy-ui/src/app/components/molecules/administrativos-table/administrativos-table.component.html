<div class="overflow-x-auto">
  <table class="w-full text-sm">
    <thead class="bg-slate-50 border-b border-slate-200">
      <tr>
        <th class="text-left px-4 py-2.5 font-medium text-slate-700">Nombre</th>
        <th class="text-left px-4 py-2.5 font-medium text-slate-700">Identificación</th>
        <th class="text-left px-4 py-2.5 font-medium text-slate-700">Correo</th>
        <th class="text-left px-4 py-2.5 font-medium text-slate-700">Estado</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-200">
      @for (admin of administrativos(); track admin.id) {
        <tr class="hover:bg-slate-50 transition-colors">
          <td class="px-4 py-3 text-slate-800">{{ admin.nombre }}</td>
          <td class="px-4 py-3 text-slate-600">{{ admin.identificacion }}</td>
          <td class="px-4 py-3 text-slate-600">{{ admin.correo }}</td>
          <td class="px-4 py-3">
            <app-badge
              [text]="admin.activo ? 'Activo' : 'Inactivo'"
              [variant]="admin.activo ? 'success' : 'default'"
            />
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
