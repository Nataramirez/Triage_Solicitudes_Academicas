<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4"
  role="dialog"
  aria-modal="true"
  aria-labelledby="crear-admin-title"
  (click)="onClose()"
>
  <div
    class="bg-white rounded-lg shadow-lg border border-slate-200 w-full max-w-md max-h-[90vh] flex flex-col"
    (click)="$event.stopPropagation()"
  >
    <header class="flex items-start justify-between gap-4 px-5 py-4 border-b border-slate-200">
      <h3 id="crear-admin-title" class="text-sm font-semibold text-slate-800">
        Registrar administrativo
      </h3>
      <button
        type="button"
        (click)="onClose()"
        class="text-slate-400 hover:text-slate-700 text-xl leading-none focus:outline-none"
        aria-label="Cerrar"
      >
        &times;
      </button>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" class="px-5 py-4 flex flex-col gap-4 overflow-y-auto">
      <app-form-field
        label="Nombre"
        inputId="admin-nombre"
        placeholder="Nombre completo"
        patternError="Este campo debe contener únicamente letras"
        [control]="form.controls.nombre"
      />
      <app-form-field
        label="Identificación"
        inputId="admin-identificacion"
        placeholder="Número de identificación"
        [control]="form.controls.identificacion"
      />
      <app-form-field
        label="Correo electrónico"
        inputId="admin-correo"
        inputType="email"
        placeholder="correo@ejemplo.com"
        [control]="form.controls.correo"
      />
      <app-form-field
        label="Contraseña"
        inputId="admin-contrasena"
        inputType="password"
        placeholder="••••••••"
        [control]="form.controls.contrasena"
      />

      @if (error()) {
        <p class="text-sm text-red-600">{{ error() }}</p>
      }

      <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-200 mt-2">
        <button
          type="button"
          (click)="onClose()"
          class="px-4 py-2 text-sm text-slate-600 hover:text-slate-800 transition-colors"
        >
          Cancelar
        </button>
        <div class="w-36">
          <app-button type="submit" [disabled]="loading() || form.invalid">
            {{ loading() ? 'Registrando...' : 'Registrar' }}
          </app-button>
        </div>
      </div>
    </form>
  </div>
</div>
