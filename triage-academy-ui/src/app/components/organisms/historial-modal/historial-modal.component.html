<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4"
  role="dialog"
  aria-modal="true"
  aria-labelledby="historial-modal-title"
  (click)="onClose()"
>
  <div
    class="bg-white rounded-lg shadow-lg border border-slate-200 w-full max-w-md max-h-[80vh] flex flex-col"
    (click)="$event.stopPropagation()"
  >
    <header class="flex items-start justify-between gap-4 px-5 py-4 border-b border-slate-200">
      <div>
        <h3 id="historial-modal-title" class="text-sm font-semibold text-slate-800">
          Historial de la solicitud
        </h3>
        <p class="text-xs text-slate-500 mt-0.5">{{ solicitud().tipo }}</p>
      </div>
      <button
        type="button"
        (click)="onClose()"
        class="text-slate-400 hover:text-slate-700 text-xl leading-none focus:outline-none"
        aria-label="Cerrar"
      >
        &times;
      </button>
    </header>

    <div class="px-5 py-4 overflow-y-auto">
      @if (loading()) {
        <p class="text-sm text-slate-500">Cargando historial...</p>
      } @else if (error()) {
        <p class="text-sm text-red-600">{{ error() }}</p>
      } @else if (items().length === 0) {
        <p class="text-sm text-slate-500">No hay registros en el historial.</p>
      } @else {
        @for (entry of items(); track entry.id; let last = $last) {
          <app-historial-item [item]="entry" [isLast]="last" />
        }
      }
    </div>
  </div>
</div>
