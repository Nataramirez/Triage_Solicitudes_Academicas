<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="bg-white rounded shadow p-8 w-full max-w-sm">
    <h1 class="text-xl font-semibold text-gray-800 mb-6">Iniciar sesión</h1>

    <app-login-form [loading]="loading" (formSubmit)="onSubmit($event)" />

    <p class="mt-4 text-sm text-center text-gray-500">
      ¿No tienes cuenta?
      <a routerLink="/register" class="text-blue-600 hover:underline">Regístrate</a>
    </p>
  </div>
</div>
