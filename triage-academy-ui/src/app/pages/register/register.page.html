<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="bg-white rounded shadow p-8 w-full max-w-sm">
    <h1 class="text-xl font-semibold text-gray-800 mb-6">Crear cuenta</h1>

    <app-register-form [loading]="loading" (formSubmit)="onSubmit($event)" />

    <p class="mt-4 text-sm text-center text-gray-500">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="text-blue-600 hover:underline">Inicia sesión</a>
    </p>
  </div>
</div>
