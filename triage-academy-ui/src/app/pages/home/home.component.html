<div class="min-h-screen bg-slate-100">
  <app-navbar title="Panel Estudiante" [navItems]="navItems" />

  <main class="max-w-3xl mx-auto mt-8 px-4">
    <h2 class="text-lg font-semibold text-slate-700 mb-4">Mis Solicitudes</h2>

    @if (loading()) {
      <p class="text-sm text-slate-500">Cargando solicitudes...</p>
    } @else if (error()) {
      <p class="text-sm text-red-600">{{ error() }}</p>
    } @else if (solicitudes().length === 0) {
      <p class="text-sm text-slate-500">No tienes solicitudes registradas.</p>
    } @else {
      <div class="flex flex-col gap-3">
        @for (solicitud of solicitudes(); track solicitud.id) {
          <app-solicitud-card [solicitud]="solicitud" (cardClick)="openHistorial($event)" />
        }
      </div>
    }
  </main>
</div>

@if (selectedSolicitud(); as sel) {
  <app-historial-modal
    [solicitud]="sel"
    [items]="historial()"
    [loading]="historialLoading()"
    [error]="historialError()"
    (closed)="closeHistorial()"
  />
}
