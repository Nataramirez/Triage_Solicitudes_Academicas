name: TRIAGE-ACADEMY-UI-CD

on:
  push:
    branches: [main]
    paths:
      - 'triage-academy-ui/**'
      - '.github/workflows/triage-academy-ui-cd.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./triage-academy-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: triage-academy-ui/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadless --if-present

      - name: Build
        run: npm run build -- --configuration production --base-href /Triage_Solicitudes_Academicas/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./triage-academy-ui/dist/triage-academy-ui/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4