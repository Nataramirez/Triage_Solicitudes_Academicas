name: TRIAGE-ACADEMY-UI-CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'triage-academy-ui/**'
      - '.github/workflows/ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./triage-academy-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: triage-academy-ui/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadless --if-present

      - name: Build
        run: npm run build -- --configuration production --base-href /Triage_Solicitudes_Academicas/